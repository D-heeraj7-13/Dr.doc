<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche GT3R Scroll Showcase</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: white;
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #loader-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        #loader-bar {
            height: 100%;
            width: 0%;
            background: #f27d26;
            transition: width 0.2s;
        }

        .content {
            height: 400vh; /* For scrolling space */
            pointer-events: none;
        }

        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="loader-bar-container">
        <div id="loader-bar"></div>
    </div>

    <canvas id="three-canvas"></canvas>

    <div class="content">
        <section class="section">
            <h1>Porsche<br>GT3R</h1>
        </section>
        <section class="section" style="justify-content: flex-end;">
            <h1 style="text-align: right;">Engineering<br>Excellence</h1>
        </section>
        <section class="section">
            <h1>Aerodynamic<br>Design</h1>
        </section>
        <section class="section" style="justify-content: center;">
            <h1 style="text-align: center;">Pure<br>Performance</h1>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= CONFIG =================
const MODEL_URL = './por.glb';

// ================= THREE SETUP =================
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 12);

// ================= LIGHTS =================
scene.add(new THREE.AmbientLight(0xffffff, 0.9));

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(8, 12, 10);
scene.add(dirLight);

const backLight = new THREE.DirectionalLight(0xffeedd, 1.2);
backLight.position.set(-10, 8, -8);
scene.add(backLight);

// ================= VARIABLES =================
let mesh = null;
let targetScroll = 0;
let currentScroll = 0;

// ================= PLACEHOLDER =================
function buildPlaceholder() {
    const g = new THREE.Mesh(
        new THREE.BoxGeometry(2, 1, 4),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    scene.add(g);
    mesh = g;
}

// ================= LOAD GLB =================
function loadGLB() {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';

    script.onload = () => {
        const loader = new THREE.GLTFLoader();
        loader.load(MODEL_URL,
            (gltf) => {
                mesh = gltf.scene;

                const box = new THREE.Box3().setFromObject(mesh);
                const size = box.getSize(new THREE.Vector3());
                const scale = 9 / Math.max(size.x, size.y, size.z);

                mesh.scale.setScalar(scale);

                const center = box.getCenter(new THREE.Vector3());
                mesh.position.set(-center.x * scale, -center.y * scale + 0.5, -center.z * scale);

                scene.add(mesh);
                console.log("✅ Porsche GT3R Loaded");
            },
            (xhr) => {
                if (xhr.total) {
                    const pct = (xhr.loaded / xhr.total) * 100;
                    document.getElementById('loader-bar').style.width = pct + '%';
                }
            },
            (err) => {
                console.error(err);
                buildPlaceholder();
            }
        );
    };
    document.head.appendChild(script);
}

// ================= ANIMATION LOOP =================
function animate() {
    requestAnimationFrame(animate);

    // Smooth scroll lerp
    currentScroll = currentScroll * 0.92 + targetScroll * 0.08;

    if (mesh) {
        // === Main Rotation ===
        mesh.rotation.y = currentScroll * Math.PI * 3.5 + 0.6;

        // === Dynamic Movement ===
        mesh.position.x = Math.sin(currentScroll * Math.PI * 2) * 2.5;
        mesh.position.z = -Math.cos(currentScroll * Math.PI) * 3;

        // Slight pitch/tilt based on scroll
        mesh.rotation.x = Math.sin(currentScroll * Math.PI * 2) * 0.15;
        mesh.rotation.z = Math.sin(currentScroll * Math.PI) * 0.08;

        // Very subtle bounce on Y
        mesh.position.y = Math.sin(currentScroll * Math.PI * 6) * 0.3;
    }

    // Camera follow
    camera.position.x = currentScroll * 3;
    camera.position.z = 12 + Math.sin(currentScroll * Math.PI) * 4;
    camera.lookAt(0, 2, 0);

    renderer.render(scene, camera);
}
animate();

// ================= SCROLL HANDLING =================
function updateScroll() {
    const scrollMax = document.documentElement.scrollHeight - window.innerHeight;
    targetScroll = window.scrollY / scrollMax; // 0 to 1
}

window.addEventListener('scroll', updateScroll, { passive: true });

// Initial call
updateScroll();

// ================= RESIZE =================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Load model
loadGLB();
</script>gege
</body>
</html>
